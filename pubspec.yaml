name: thaheen_task
description: "Thaheen Mini Offline LMS — an Arabic-first offline learning app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  video_player: ^2.14.0
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/videos/
